[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agent"
version = "1.0.0"
description = "Private AI crypto trading research agent, paper/research MVP"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "apscheduler>=3.10,<4",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "pandas-ta>=0.3.14b0",
  "pydantic>=2,<3",
  "python-telegram-bot>=21,<23",
  "structlog>=24,<26",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
trading-agent = "agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires a PostgreSQL instance"]
