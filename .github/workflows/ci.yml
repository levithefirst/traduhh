name: CI

# Part 18 Step 12: "tests in CI locally (pytest) — lookahead and idempotency
# tests green." This workflow is the CI half of that acceptance line: it runs
# the full suite, including the PostgreSQL-backed integration tests that are
# honestly skipped in any environment without a database, against a real
# postgres:16 service so every lookahead and idempotency test actually
# executes and must pass, not just be present.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://agent:agent@localhost:5432/agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Compile check
        run: python -m compileall -q src tests

      - name: Full test suite (unit + PostgreSQL integration)
        run: |
          set -o pipefail
          pytest -v -rs | tee /tmp/pytest.log
          if grep -q "^SKIPPED" /tmp/pytest.log; then
            echo "::error::A test was skipped with a live DATABASE_URL set — the PostgreSQL service is not being reached, or an integration test regressed to skipping."
            exit 1
          fi
